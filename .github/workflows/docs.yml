name: Docs

# Builds the Sphinx site with warnings as errors, so a broken page, link or docstring fails
# the pull request. Read the Docs builds and hosts the published site from main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package with the docs extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"

      - name: Build the docs (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs _build/html
