name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff and mypy
        run: pip install ruff "mypy==2.4.1" numpy

      - name: Ruff format check
        run: ruff format --check geomech/ tests/ scripts/ examples/generated/ examples/inverted_rigid_pendulum_lqr.py examples/report_*.py

      - name: Ruff lint
        run: ruff check geomech/ tests/ scripts/ examples/generated/ examples/inverted_rigid_pendulum_lqr.py examples/report_*.py

      - name: Mypy
        run: mypy geomech --ignore-missing-imports

      - name: Generated code is up to date
        run: python scripts/regenerate_generated.py --check

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install the optional CasADi target (one job)
        if: matrix.python-version == '3.12'
        run: pip install -e ".[casadi]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Run the report examples (outputs discarded)
        if: matrix.python-version == '3.12'
        run: |
          out="$(mktemp -d)"
          for script in examples/report_*.py; do
            python "$script" "$out/$(basename "$script" .py).html"
          done
          rm -rf "$out"
