[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geomech"
version = "0.2.0.dev0"
description = "Symbolic computation of dynamics on smooth manifolds"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Prasanth Kotaru" }
]
keywords = [
    "geometric-mechanics",
    "equations-of-motion",
    "symbolic-computation",
    "lagrangian-mechanics",
    "robotics",
    "SO3",
    "S2",
    "linearization",
    "code-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
]


[project.urls]
Homepage = "https://github.com/vkotaru/geomech"
Documentation = "https://geomech.readthedocs.io"
Repository = "https://github.com/vkotaru/geomech"
Changelog = "https://github.com/vkotaru/geomech/blob/main/CHANGELOG.md"
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy==2.4.1",
    "jupyterlab",
    "scipy",
]
casadi = [
    "casadi>=3.6,<4",
]
sim = [
    "scipy",
]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1.29",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5.2",
]

[tool.setuptools.packages.find]
include = ["geomech*"]

[tool.setuptools.package-data]
"geomech.viz" = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E741",   # ambiguous variable name (l, I, O — common in math/physics)
    "E731",   # lambda assignment (used for lazy constants)
    "E701",   # multiple statements on one line (match/case style)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # re-exports and version-gated imports are intentional
"examples/*" = ["F401", "E402", "F811"]  # examples are scripts

[tool.ruff.lint.isort]
known-first-party = ["geomech"]
