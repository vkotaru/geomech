    } else {
      geo = new THREE.SphereGeometry(sh.radius, 40, 20);
      mesh = new THREE.Mesh(geo, standard(base));
      // a large cap on body e1 and a smaller one on e2 (SphereGeometry caps open at +y)
      var cap1 = new THREE.SphereGeometry(1.012 * sh.radius, 32, 8, 0, 2 * Math.PI, 0, Math.PI / 4);
      cap1.rotateZ(-Math.PI / 2);
      var cap2 = new THREE.SphereGeometry(1.012 * sh.radius, 32, 6, 0, 2 * Math.PI, 0, Math.PI / 7);
      markers = [marker(cap1, base, 0), marker(cap2, base, 1)];
    }
    mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh);
    (markers || []).forEach(function (m) { g.add(m); });
    var edgeMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.55 });
    themed.push([edgeMat, function () { return new THREE.Color(token("--edge")); }]);
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat));
    var axes = null;
    if (b.axes) {
      axes = new THREE.Group();
      // radius proportional to the arrows (no absolute clamp: a 1 km and a 1 mm body
      // look alike)
      var r = 0.02 * Math.max.apply(null, b.axisLengths);
      for (var k = 0; k < 3; k++) axes.add(arrow(k, b.axisLengths[k], r, axisColor(k)));
      g.add(axes);
    }
    world.add(g);
    return { group: g, axes: axes, rot: S.rotations[b.rot], pos: b.pos };
  });

  var points = S.points.map(function (pm) {
    var m = new THREE.Mesh(new THREE.SphereGeometry(pm.radius, 32, 16), standard(function () { return colorOf(pm.color); }, { roughness: 0.35 }));
    m.castShadow = true;
    world.add(m);
    return { mesh: m, pos: pm.pos };
  });

  var yAxis = new THREE.Vector3(0, 1, 0);
  var rods = S.rods.map(function (rd) {
    var geo = new THREE.CylinderGeometry(rd.radius, rd.radius, 1, 12);
    geo.translate(0, 0.5, 0); // from its base along +y
    var m = new THREE.Mesh(geo, standard(function () { return colorOf(rd.color); }, { roughness: 0.7 }));
    m.castShadow = true;
    world.add(m);
    return { mesh: m, ends: rd.ends };
  });

  var traceGroup = new THREE.Group();
  world.add(traceGroup);
  var traces = S.traces.map(function (tr) {
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(tr.pos, 3));
    var mat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.9 });
    themed.push([mat, function () { return colorOf(tr.color); }]);
    var line = new THREE.Line(geo, mat);
    line.frustumCulled = false;
    traceGroup.add(line);
    return line;
  });

  // ---------------------------------------------------------------- camera
  var camera = new THREE.PerspectiveCamera(40, 1, 0.01 * R, 100 * R);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  function resetCamera() {
    var c = [C[0], C[1], C[2]];
    // about 5 R away: the 40° view then spans ±1.8 R, the whole bounding box (corners at √3 R)
    camera.position.copy(toThree([c[0] + 2.8 * R, c[1] - 3.85 * R, c[2] + 1.6 * R]));
    controls.target.copy(toThree(c));
    camera.updateProjectionMatrix();
    controls.update();
  }
  resetCamera();

  function applyTheme() {
    scene.background = new THREE.Color(token("--canvas-bg"));
    themed.forEach(function (t) { t[0].color.copy(t[1]()); });
    shadowMat.opacity = parseFloat(token("--shadow")) || 0.22;
    sprites.forEach(function (s) { s.userData.redraw(); });
    buildGrid();
    requestRender();
  }

  // ---------------------------------------------------------------- frames
  var frame = 0;
  function setFrame(k) {
    frame = k;
    bodies.forEach(function (b) {
      var r = b.rot, o = 9 * k, q = 3 * k;
      b.group.matrix.set(r[o], r[o + 1], r[o + 2], b.pos[q],
                         r[o + 3], r[o + 4], r[o + 5], b.pos[q + 1],
                         r[o + 6], r[o + 7], r[o + 8], b.pos[q + 2],
                         0, 0, 0, 1);
      b.group.matrixWorldNeedsUpdate = true;
    });
    points.forEach(function (pm) { pm.mesh.position.set(pm.pos[3 * k], pm.pos[3 * k + 1], pm.pos[3 * k + 2]); });
    var a = new THREE.Vector3(), d = new THREE.Vector3();
    rods.forEach(function (rd) {
      var o = 6 * k, e = rd.ends;
      a.set(e[o], e[o + 1], e[o + 2]);
      d.set(e[o + 3] - e[o], e[o + 4] - e[o + 1], e[o + 5] - e[o + 2]);
      var len = d.length();
      rd.mesh.position.copy(a);
      rd.mesh.scale.set(1, Math.max(len, 1e-9), 1);
      if (len > 0) rd.mesh.quaternion.setFromUnitVectors(yAxis, d.divideScalar(len));
    });
    traces.forEach(function (line) { line.geometry.setDrawRange(0, k + 1); });
    scrub.value = String(k);
    timeLabel.textContent = "t = " + (S.t0 + S.t[k]).toFixed(2) + " s";
    requestRender();
  }

  // ---------------------------------------------------------------- controls
  var playBtn = document.getElementById("gm-play");
  var scrub = document.getElementById("gm-scrub");
  var timeLabel = document.getElementById("gm-time");
  var speedSel = document.getElementById("gm-speed");
  var themeBtn = document.getElementById("gm-theme");
  scrub.max = String(N - 1);
  // a single stored state has nothing to play
  playBtn.disabled = N < 2;
  scrub.disabled = N < 2;
  var playing = N > 1, simTime = 0, last = null;
  function setPlaying(on) { playing = on && N > 1; playBtn.textContent = playing ? "Pause" : "Play"; last = null; if (playing) requestRender(); }
  playBtn.addEventListener("click", function () {
    if (N < 2) return;
    if (!playing && frame >= N - 1) simTime = 0;
    setPlaying(!playing);
  });
  scrub.addEventListener("input", function () {
    setPlaying(false);
    var k = parseInt(scrub.value, 10);
    simTime = S.t[k];
    setFrame(k);
  });
  document.getElementById("gm-reset").addEventListener("click", resetCamera);
  document.getElementById("gm-axes").addEventListener("change", function (e) {
    bodies.forEach(function (b) { if (b.axes) b.axes.visible = e.target.checked; });
    requestRender();
  });
  document.getElementById("gm-traces").addEventListener("change", function (e) {
    traceGroup.visible = e.target.checked; requestRender();
  });
  var themes = ["auto", "light", "dark"];
  themeBtn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme") || "auto";
    var next = themes[(themes.indexOf(cur) + 1) % 3];
    if (next === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", next);
    themeBtn.textContent = "Theme: " + next;
  });
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", applyTheme);
  }

  function frameAt(t) { // the last stored frame at or before t
    var lo = 0, hi = N - 1;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (S.t[mid] <= t) lo = mid; else hi = mid - 1; }
    return lo;
  }

  function resize() {
    var w = host.clientWidth || 300;
    renderer.setSize(w, w, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
    requestRender();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
  window.addEventListener("resize", resize);

  var pending = false, checked = false;
  function requestRender() { if (!pending) { pending = true; requestAnimationFrame(tick); } }
  controls.addEventListener("change", requestRender);
  function tick(ts) {
    pending = false;
    if (playing && N > 1) {
      if (last !== null) {
        simTime += ((ts - last) / 1000) * parseFloat(speedSel.value);
        // past the end: show the last stored state once, then start over
        if (simTime > S.t[N - 1]) simTime = frame === N - 1 ? 0 : S.t[N - 1];
      }
      last = ts;
      var k = frameAt(simTime);
      if (k !== frame) setFrame(k);
    }
    var moving = controls.update();
    renderer.render(scene, camera);
    renderGizmo();
    if (!checked) { checked = true; selfCheck(); }
    if (playing || moving) requestRender();
  }

  // The inertial gizmo in the bottom-left corner, turned like the main camera.
  function renderGizmo() {
    var w = host.clientWidth || 300, gs = Math.max(96, Math.min(140, Math.round(0.24 * w)));
    gizmoCam.position.set(0, 0, 8).applyQuaternion(camera.quaternion);
    gizmoCam.quaternion.copy(camera.quaternion);
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.setScissorTest(true);
    renderer.setScissor(6, 6, gs, gs);
    renderer.setViewport(6, 6, gs, gs);
    renderer.render(gizmoScene, gizmoCam);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, w, w);
    renderer.autoClear = true;
  }

  // The number of distinct colours on a coarse grid of the canvas, on the root element
  // (data-gm-canvas-colors): a smoke test reads it to tell a drawn scene from a blank one.
  function selfCheck() {
    try {
      var gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
      var px = new Uint8Array(4 * w * h), seen = {};
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (var i = 1; i < 32; i++) for (var j = 1; j < 32; j++) {
        var o = 4 * (Math.floor((j * h) / 32) * w + Math.floor((i * w) / 32));
        seen[px[o] + "," + px[o + 1] + "," + px[o + 2]] = 1;
      }
      document.documentElement.setAttribute("data-gm-canvas-colors", String(Object.keys(seen).length));
    } catch (e) {
      document.documentElement.setAttribute("data-gm-canvas-colors", "error");
    }
  }

  applyTheme();
  resize();
  setFrame(0);
  setPlaying(playing);
  viewer("ready");
})();
</script>
</body>
</html>
